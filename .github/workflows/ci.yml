name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # completion の E2E が zsh（zpty）を使う
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      # mise.toml の [tools]（node / python / actionlint）を導入
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          cache: true

      - run: mise run install
      - run: mise run lint
      - run: mise run lint:actions
      - run: mise run typecheck
      # unit + 常時 E2E（build と python venv の用意を含む）。AWS 資格情報は渡さない
      - run: mise run test
      - run: mise run pack:check
