[tools]
node = "24"
python = "3.13"

[tasks.typecheck]
description = "型チェック"
run = "tsc -p tsconfig.json"

[tasks.build]
description = "dist へビルド"
run = "rm -rf dist && tsc -p tsconfig.build.json && chmod +x dist/cli/index.js"

[tasks."test:unit"]
description = "Unit テスト"
run = "vitest run test/unit"

[tasks."test:e2e:python-env"]
description = "flareon dev（python）の E2E 用 venv を .flareon/e2e-python に用意（初回のみ pip でネットワークを使う）"
sources = ["test/e2e/python/requirements.txt"]
outputs = [".flareon/e2e-python/.installed"]
run = [
  "python -m venv .flareon/e2e-python",
  ".flareon/e2e-python/bin/python -m pip install --quiet --disable-pip-version-check -r test/e2e/python/requirements.txt",
  "touch .flareon/e2e-python/.installed",
]

[tasks."test:e2e"]
description = "E2E テスト（ビルド済み CLI を実行）"
depends = ["build", "test:e2e:python-env"]
run = "vitest run test/e2e --exclude 'test/e2e/aws/**'"

[tasks."test:e2e:file"]
description = "常時 E2E を指定ファイルだけ実行（例: mise run test:e2e:file test/e2e/dev.test.ts）"
depends = ["build", "test:e2e:python-env"]
run = "vitest run"

[tasks."test:e2e:aws"]
description = "実 AWS E2E（FLAREON_E2E_AWS=1 のときだけ実行。deploy → 検証 → destroy）"
depends = ["build", "playwright:install"]
run = "vitest run test/e2e/aws"

[tasks."test:e2e:aws:file"]
description = "実 AWS E2E を指定ファイルだけ実行（例: mise run test:e2e:aws:file test/e2e/aws/logs-follow.test.ts）"
depends = ["build", "playwright:install"]
run = "vitest run"

[tasks."playwright:install"]
description = "E2E 用の Chromium を取得"
run = "playwright install chromium"

[tasks.test]
description = "Unit + E2E"
depends = ["test:unit", "test:e2e"]

[tasks."pack:check"]
description = "npm パッケージの同梱物を確認（npm pack --dry-run）"
run = "npm pack --dry-run"

[tasks.lint]
description = "ESLint + Prettier チェック"
run = ["eslint .", "prettier --check ."]

[tasks.fmt]
description = "Prettier で整形"
run = "prettier --write ."

[tasks.dev]
description = "CLI を tsc watch でビルド"
run = "tsc -p tsconfig.build.json --watch"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
